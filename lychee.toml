# Lychee Link Checker Configuration
# https://github.com/lycheeverse/lychee

# Maximum number of concurrent network requests
max_concurrency = 10

# Request timeout in seconds
timeout = 20

# Accept these HTTP status codes as valid
accept = [200, 201, 204, 403, 406, 429, 503]

# Exclude URL patterns (regex)
exclude = [
    # Local development URLs
    'localhost',
    'http://127\.0\.0\.1',
    'https://127\.0\.0\.1',
    'http://0\.0\.0\.0',
    'host\.docker\.internal',

    # Example/placeholder URLs used in posts
    'example\.com',
    'your-username',
    'your-handle',
    'your-endpoint',
    'github\.com/example/',
    'github\.com/<org>/<repo>',
    'slim-controller-public-address',
    'slim-dataplane-public-address',

    # GitHub pages that redirect or require auth in CI
    'https://github\.com/settings',
    'https://github\.com/login/device',
    'https://github\.com/.*/edit/',

    # Sites that commonly block or rate-limit automated checkers
    'linkedin\.com',
    'googletagmanager\.com',
    'fonts\.googleapis\.com',
    'fonts\.gstatic\.com',
    'w3\.org',
]

# Exclude paths (regex patterns relative to the input)
# Skip 404.html: root-relative links need a base URL lychee cannot resolve for local files
exclude_path = ['(^|/)404\\.html$']

# Enable link caching for faster subsequent runs
cache = true

# Maximum number of retries per link (helps with transient HTTP/2 errors)
max_retries = 3

# HTTP method to use for checking links
method = "get"

# Exclude links from code blocks, preformatted text, and other verbatim content
include_verbatim = false

# User agent string
user_agent = "lychee/agntcy-blogs"
