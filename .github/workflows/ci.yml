name: CI

on:
  pull_request:
    branches: ["main"]
  schedule:
    # Catch link rot in published posts
    - cron: "00 06 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check spelling
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          config: .codespellrc
      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: 'npm'
      - name: Setup Ruby
        uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 0
      - name: Install slide build dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci
      - name: Build slides
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build:slides
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Restore lychee cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: |
            cache-lychee-
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/_site
            --exclude-all-private
            --remap 'https://blogs.agntcy.org file://${{ github.workspace }}/_site'
            _site
