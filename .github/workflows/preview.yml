name: PR Preview

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths:
      - "_posts/**"
      - "presentations/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"

# This job builds pull request content, including content from forks, so it gets
# a read-only token and never deploys. Publishing happens in
# preview-deploy.yml, which runs in the base repository context.
permissions:
  contents: read
  pull-requests: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Sanitize branch name
        id: branch
        run: |
          BRANCH="${{ github.head_ref }}"
          SAFE=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Keep only PR-changed posts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | grep '^_posts/' || true)
          if [ -z "$CHANGED" ]; then
            echo "No _posts changes in this PR."
          else
            echo "Keeping: $CHANGED"
          fi
          # Remove every post that is NOT in the PR diff
          for f in _posts/*.md; do
            if ! echo "$CHANGED" | grep -qF "$f"; then
              rm "$f"
            fi
          done

      - name: Setup Ruby
        uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 0

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: 'npm'

      - name: Install slide build dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Build slides
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build:slides

      # --future so a draft dated ahead of today still shows up in its preview.
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/drafts/${{ steps.branch.outputs.safe }}" --future
        env:
          JEKYLL_ENV: production

      - name: Upload built preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: _site
          retention-days: 1
