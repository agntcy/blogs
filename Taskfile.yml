version: "3"

env:
  GEM_HOME: ./.bundle

tasks:
  default:
    cmds:
      - task -l

  ##
  ## Website
  ##
  build:
    desc: Build content website
    deps:
      - deps
      - build:slides
    cmds:
      - bundle exec jekyll build

  build:slides:
    desc: Build slide decks under presentations
    cmds:
      - |
        set -euo pipefail
        required="20.19.5"
        skip() {
          echo "Skipping slide build: $1 Jekyll will still run."
          exit 0
        }
        command -v node >/dev/null 2>&1 || skip "Node ${required}+ is required (Slidev)."
        if ! REQUIRED="$required" node -e '
          const req = process.env.REQUIRED.split(".").map(Number);
          const cur = process.versions.node.split(".").map(Number);
          for (let i = 0; i < 3; i++) {
            if ((cur[i] || 0) > req[i]) process.exit(0);
            if ((cur[i] || 0) < req[i]) process.exit(1);
          }
        '; then
          skip "Node $(node -v) is below ${required} (required by Slidev)."
        fi
        task deps:slides
        node scripts/build-presentations.mjs

  run:
    desc: Run content website in live editing mode
    deps:
      - deps
      - build:slides
    cmds:
      - bundle exec jekyll serve --livereload --host 0.0.0.0

  run:prod:
    desc: Run content website in production mode (enables analytics)
    deps:
      - deps
      - build:slides
    cmds:
      - JEKYLL_ENV=production bundle exec jekyll serve --livereload --host 0.0.0.0

  ##
  ## Testing and Linting
  ##
  lint:
    desc: Run all linting checks
    cmds:
      - task: lint:spelling
      - task: lint:markdown
      - task: lint:links

  lint:spelling:
    desc: Check spelling in posts and site source
    preconditions:
      - sh: command -v codespell
        msg: "codespell is required. Install it with: pip install codespell"
    cmds:
      - codespell --config .codespellrc

  lint:markdown:
    desc: Check Markdown syntax and style
    preconditions:
      - sh: python3 -c "import pymarkdown"
        msg: "pymarkdown is required. Install it with: pip install pymarkdownlnt"
    cmds:
      - python3 -m pymarkdown --config .pymarkdown scan . _posts

  lint:fix:
    desc: Auto-fix lint issues where possible
    cmds:
      - task: lint:fix:spelling
      - task: lint:fix:markdown

  lint:fix:spelling:
    desc: Auto-fix spelling issues
    preconditions:
      - sh: command -v codespell
        msg: "codespell is required. Install it with: pip install codespell"
    cmds:
      - codespell --config .codespellrc --write-changes

  lint:fix:markdown:
    desc: Auto-fix Markdown issues
    preconditions:
      - sh: python3 -c "import pymarkdown"
        msg: "pymarkdown is required. Install it with: pip install pymarkdownlnt"
    cmds:
      - python3 -m pymarkdown --config .pymarkdown fix . _posts

  lint:links:
    desc: Check for broken links in the built site
    deps:
      - deps
    preconditions:
      - sh: command -v lychee
        msg: "lychee is required. Install it from https://github.com/lycheeverse/lychee"
    cmds:
      - bundle exec jekyll build
      - |
        set -euo pipefail
        if [ -z "${GITHUB_TOKEN:-}" ] && command -v gh >/dev/null 2>&1; then
          GITHUB_TOKEN="$(gh auth token 2>/dev/null || true)"
          export GITHUB_TOKEN
        fi
        # Local lint does not require Slidev. CI builds decks first and checks them.
        extra_exclude=()
        if ! find presentations -path 'presentations/*/site/index.html' -print -quit | grep -q .; then
          extra_exclude+=(--exclude '(^|/)presentations/.*/site')
        fi
        lychee \
          --config lychee.toml \
          --root-dir "$PWD/_site" \
          --exclude-all-private \
          --remap "https://blogs.agntcy.org file://$PWD/_site" \
          "${extra_exclude[@]}" \
          _site

  ##
  ## Dependencies
  ##
  deps:
    desc: Install dependencies
    sources:
      - Gemfile
      - Gemfile.lock
    generates:
      - .bundle/config
    cmds:
      - bundle install

  deps:slides:
    desc: Install slide build dependencies
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - if [ -f package-lock.json ]; then npm ci; else npm install; fi
