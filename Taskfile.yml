version: "3"

env:
  GEM_HOME: ./.bundle

tasks:
  default:
    cmds:
      - task -l

  ##
  ## Website
  ##
  build:
    desc: Build content website
    deps:
      - deps
      - build:slides
    cmds:
      - bundle exec jekyll build

  build:slides:
    desc: Build slide decks under presentations
    deps:
      - deps:slides
    cmds:
      - node scripts/build-presentations.mjs

  run:
    desc: Run content website in live editing mode
    deps:
      - deps
      - build:slides
    cmds:
      - bundle exec jekyll serve --livereload --host 0.0.0.0

  run:prod:
    desc: Run content website in production mode (enables analytics)
    deps:
      - deps
      - build:slides
    cmds:
      - JEKYLL_ENV=production bundle exec jekyll serve --livereload --host 0.0.0.0

  ##
  ## Dependencies
  ##
  deps:
    desc: Install dependencies
    sources:
      - Gemfile
      - Gemfile.lock
    generates:
      - .bundle/config
    cmds:
      - bundle install

  deps:slides:
    desc: Install slide build dependencies
    cmds:
      - if [ -f package-lock.json ]; then npm ci; else npm install; fi
